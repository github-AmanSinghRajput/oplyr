# electron-builder config for the Oplyr macOS app (DMG, Developer ID, notarized).
# STARTING SCAFFOLD — the first real build will need iteration (see docs/DISTRIBUTION.md Phase 2).
# Run from apps/desktop:  npm run dist   (after `npm run build` compiles src → dist)
appId: com.oplyr.desktop
productName: Oplyr
copyright: © 2026 Oplyr
# Set explicitly so electron-builder doesn't need to resolve the (hoisted) electron module to find it.
electronVersion: 42.5.0
# Monorepo: do NOT let electron-builder install/rebuild/prune the hoisted root node_modules (that step
# was deleting devDeps like typescript). We rebuild native modules (better-sqlite3) ourselves and ship
# them via extraResources. Native app deps (node-pty) are rebuilt manually with @electron/rebuild.
npmRebuild: false

directories:
  output: release
  buildResources: assets # holds icon.icns + entitlements.mac.plist (tracked; not the gitignored build/)

# Files that make up the Electron app itself (compiled main + preload).
files:
  - dist/**/*
  - package.json

# Things shipped alongside the app under Contents/Resources/…
# ⚠️ The API needs its runtime dependencies too. `../api/dist` alone is NOT enough — better-sqlite3
# (native) and the API's other prod deps must be present. Recommended approach (see docs): bundle the
# API with esbuild into a single file with better-sqlite3 marked external, and ship better-sqlite3 +
# its deps here. This block is the target layout main.ts expects (resources/api, resources/stt).
extraResources:
  # The web UI (React build). main.ts loads Resources/web/dist/index.html in packaged mode.
  # Build it first: `npm run build -w @oplyr/web` (with vite base './' so file:// asset paths work).
  - from: ../web/dist
    to: web/dist
  # esbuild bundle of the API (run `npm run build:pack -w @oplyr/runtime` first).
  - from: ../api/dist-pack/server.mjs
    to: api/server.mjs
  # SQL migrations are read from disk at runtime (not bundled into the JS).
  - from: ../api/database
    to: api/database
  # Native better-sqlite3 — MUST be rebuilt for Electron's ABI before packaging (see docs Phase 2).
  # Shipped OUTSIDE asar so the forked (ELECTRON_RUN_AS_NODE) API process can require it.
  - from: ../../node_modules/better-sqlite3
    to: api/node_modules/better-sqlite3
    # Ship only what's needed at runtime (the compiled .node). Exclude native build intermediates
    # (*.o / *.a / obj.target / .deps): codesign fails trying to timestamp them and they're unused.
    filter:
      - "**/*"
      - "!**/*.o"
      - "!**/*.a"
      - "!build/Release/obj.target/**"
      - "!build/Release/.deps/**"
  - from: ../../node_modules/bindings
    to: api/node_modules/bindings
  # bindings' runtime dependency (better-sqlite3 → bindings → file-uri-to-path).
  - from: ../../node_modules/file-uri-to-path
    to: api/node_modules/file-uri-to-path
  # Native node-pty — the API forks it for the integrated terminal, the shell, and live CLI
  # model/usage scraping. esbuild marks it external (--external:node-pty), so it MUST ship here or
  # the packaged server crashes at startup with ERR_MODULE_NOT_FOUND (node-pty) and no port opens.
  # Rebuilt for Electron's ABI by scripts/rebuild-native-electron.sh (ships build/Release/pty.node +
  # spawn-helper). No runtime npm deps on macOS (node-addon-api = build headers; ps-list = Win test).
  - from: ../../node_modules/node-pty
    to: api/node_modules/node-pty
    # Same as better-sqlite3: keep pty.node + spawn-helper, drop native build intermediates.
    filter:
      - "**/*"
      - "!**/*.o"
      - "!**/*.a"
      - "!build/Release/obj.target/**"
      - "!build/Release/.deps/**"
  # Native STT binary (build first: cd ../stt && swift build -c release).
  - from: ../stt/.build/release/oplyr-stt
    to: stt/oplyr-stt
  # Brain semantic-recall embeddings, shipped so they run fully OFFLINE. @xenova/transformers is kept
  # external in the API bundle, so it + its ONNX runtime + the MiniLM model must ship next to
  # server.mjs.
  - from: ../api/models/Xenova
    to: api/models/Xenova
  - from: ../../node_modules/@xenova/transformers
    to: api/node_modules/@xenova/transformers
  # onnxruntime-node is NOT optional, despite the WASM runtime also shipping. transformers'
  # backends/onnx.js has a STATIC `import * as ONNX_NODE from 'onnxruntime-node'`, so the module has
  # to RESOLVE even when the WASM backend is the one that ends up being used. Leaving it out did not
  # "fall back" — it failed the whole embedding path at load with
  #   Cannot find package 'onnxruntime-node' imported from .../backends/onnx.js
  # which meant every brain atom was stored with no vector and semantic recall silently degraded to
  # keyword overlap. That shipped in every build through 0.4.1.
  # Filtered to darwin/arm64, the only platform we ship: 92MB of prebuilt binaries → ~20MB.
  # napi-v3 is ABI-stable, so unlike better-sqlite3/node-pty this needs NO Electron rebuild.
  - from: ../../node_modules/onnxruntime-node
    to: api/node_modules/onnxruntime-node
    filter:
      - "**/*"
      - "!bin/napi-v3/linux/**"
      - "!bin/napi-v3/win32/**"
      - "!bin/napi-v3/darwin/x64/**"
  # `sharp` must RESOLVE for the same reason onnxruntime-node must: transformers' utils/image.js
  # opens with a static `import sharp from 'sharp'`, and transformers.js re-exports that file. A
  # packaged build without it died at load with
  #   Cannot find package 'sharp' imported from .../@xenova/transformers/src/utils/image.js
  # and stored every memory with no vector. This is the SECOND dependency this hand-written list
  # has missed, so read the note in resources/sharp-stub/index.mjs before touching any of it.
  #
  # A stub, not the real package: sharp decodes images, Oplyr embeds only text, and shipping it
  # would add ~25MB plus a 37-package closure to enumerate here. Running without sharp is the
  # library's own supported configuration (its package.json sets `"browser": {"sharp": false}`),
  # and sharp-stub.test.ts fails if that ever stops being true.
  - from: resources/sharp-stub
    to: api/node_modules/sharp
  - from: ../../node_modules/onnxruntime-web
    to: api/node_modules/onnxruntime-web
  - from: ../../node_modules/onnxruntime-common
    to: api/node_modules/onnxruntime-common
  - from: ../../node_modules/@huggingface/jinja
    to: api/node_modules/@huggingface/jinja

# Native addons (*.node) can't run from inside the asar archive — keep them unpacked.
asarUnpack:
  - "**/*.node"

# Auto-update feed → the existing public `oplyr-releases` repo. The INITIAL download stays gated
# (polished DMG in private R2 + emailed /get link); this repo hosts only the update artifacts
# (mac .zip + latest-mac.yml) so already-installed apps pull patches. `npm run dist:publish` uploads
# them here (needs GH_TOKEN); the app reads the feed anonymously. `npm run dist` builds the gated DMG
# WITHOUT publishing, so the DMG never lands in the public repo.
publish:
  provider: github
  owner: github-AmanSinghRajput
  repo: oplyr-releases
  releaseType: release

mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false
  target:
    # dmg = manual/gated first install. zip = what electron-updater downloads to apply mac updates
    # (it swaps the .app from the zip); latest-mac.yml references the zip, so this is required for
    # auto-update to work at all.
    #
    # Both are declared, but do NOT build them in ONE invocation (`--mac dmg zip`, or a bare
    # `--mac`). electron-builder runs targets concurrently, so `hdiutil create -srcfolder` copies
    # Oplyr.app while the zip target reads the same tree, and hdiutil intermittently dies with a
    # bare `unable to execute hdiutil ... Exit code: 1`. It retries, so the build usually still
    # succeeds, which is exactly why this looked like noise instead of a bug.
    #
    # Use `npm run dist:mac`, which builds them one at a time. Order matters there: the LAST target
    # to run owns `latest-mac.yml`, and the update feed must point at the zip, so the zip goes last.
    # A dmg-last build silently rewrites the feed to `path: Oplyr-x.y.z-arm64.dmg`, which would
    # break auto-update for every existing install.
    - dmg
    - zip
  # FREE BUILD (no paid Apple account): notarization OFF. electron-builder signs with whatever cert
  # is in your keychain (the free "Apple Development" cert works for running on YOUR OWN Mac). The
  # resulting DMG is TESTING-ONLY — other Macs will warn ("can't verify developer"); the user must
  # right-click → Open. To distribute for real: get the paid account, set `notarize: true`, and
  # export APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID before `npm run dist`.
  notarize: true

dmg:
  # The DMG volume icon also uses the Oplyr logo.
  icon: assets/icon.icns
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
